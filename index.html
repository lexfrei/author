  <style>
    :root {
      color-scheme: dark;
      --red: #8f2027;
      --red-deep: #75171e;
      --paper: #f4ead2;
      --ink: #130f0d;
      --line: rgba(244, 234, 210, .28);
      --edge: clamp(18px, 3.2vw, 54px);
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; min-height: 100%; margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      background: var(--red);
      color: var(--paper);
      font-family: Arial, Helvetica, sans-serif;
    }

    .poster {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 49% 47%, rgba(177, 52, 51, .52), transparent 52%),
        linear-gradient(137deg, var(--red) 0%, #8b1e25 58%, var(--red-deep) 100%);
    }

    .poster::before {
      content: "";
      position: absolute;
      z-index: 1;
      inset: var(--edge);
      border: 1px solid var(--line);
      pointer-events: none;
    }

    .poster::after {
      content: "";
      position: absolute;
      z-index: 1;
      width: min(41vw, 560px);
      aspect-ratio: 1;
      right: -14vw;
      top: -26vw;
      border: 1px solid rgba(19, 15, 13, .24);
      border-radius: 50%;
      box-shadow: 0 0 0 28px rgba(19, 15, 13, .035), 0 0 0 56px rgba(19, 15, 13, .035), 0 0 0 84px rgba(19, 15, 13, .035);
      pointer-events: none;
    }

    .catalogue {
      position: absolute;
      z-index: -1;
      inset: -38vh -20vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(13px, 2.1vh, 28px);
      transform: rotate(-11deg) scale(1.12);
      transform-origin: center;
      opacity: .8;
      pointer-events: none;
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 11%, #000 89%, transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0%, #000 11%, #000 89%, transparent 100%);
    }

    .lane {
      display: flex;
      width: max-content;
      white-space: nowrap;
      will-change: transform;
    }

    .lane__run {
      display: flex;
      flex: none;
      align-items: center;
      gap: clamp(27px, 4.4vw, 76px);
      padding-right: clamp(27px, 4.4vw, 76px);
    }

    .entry {
      display: inline-flex;
      align-items: baseline;
      gap: .46em;
      color: rgba(244, 234, 210, .77);
      font-size: clamp(14px, 1.55vw, 25px);
      font-weight: 700;
      letter-spacing: .025em;
      line-height: 1;
      text-shadow: 0 1px 0 rgba(19, 15, 13, .15);
    }

    .entry__title, .entry__year { color: var(--paper); }
    .entry__dash { color: rgba(244, 234, 210, .5); }
    .entry__mask { color: var(--ink); letter-spacing: .015em; }

    .composition {
      position: relative;
      z-index: 2;
      display: flex;
      height: 100vh;
      height: 100svh;
      min-height: 0;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(var(--edge) + clamp(10px, 3svh, 32px)) calc(var(--edge) + clamp(22px, 5.2vw, 86px));
      pointer-events: none;
    }

    .headline {
      position: relative;
      width: fit-content;
      max-width: 100%;
      margin: 0;
      font-family: "Arial Black", Arial, Helvetica, sans-serif;
      font-weight: 900;
      line-height: .83;
      letter-spacing: -.075em;
      text-transform: uppercase;
      text-wrap: balance;
      text-shadow: 0 2px 0 rgba(19, 15, 13, .08);
    }

    .headline--first {
      font-family: Helvetica, Arial, sans-serif;
      font-size: clamp(43px, min(11.25vw, 16svh), 190px);
      max-width: 9.6em;
      align-self: flex-start;
    }

    .headline--second {
      font-family: Inter, Helvetica, Arial, sans-serif;
      font-size: clamp(43px, min(11.7vw, 16svh), 198px);
      max-width: 9em;
      align-self: flex-end;
      text-align: right;
    }

    .headline__line { display: block; }
    .headline--first .headline__line:last-child { padding-left: .58em; }
    .headline--second .headline__line:first-child { padding-right: .7em; }

    .date {
      display: block;
      margin-top: clamp(12px, 2.5svh, 26px);
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(15px, 2vw, 28px);
      font-weight: 700;
      letter-spacing: .04em;
      line-height: 1;
      text-transform: none;
    }

    .headline--second .date { text-align: right; }

    .date::before {
      content: "";
      display: inline-block;
      width: clamp(32px, 5vw, 74px);
      height: 2px;
      margin: 0 .65em .28em 0;
      background: currentColor;
      opacity: .75;
    }

    .headline--second .date::before { margin: 0 .65em .28em 0; }

    .registration {
      position: absolute;
      z-index: 3;
      top: 50%;
      left: calc(var(--edge) + 1px);
      width: clamp(13px, 1.2vw, 18px);
      height: 76px;
      transform: translateY(-50%);
      opacity: .6;
      background: linear-gradient(var(--paper), var(--paper)) center / 1px 100% no-repeat,
        linear-gradient(var(--paper), var(--paper)) left 0 / 100% 1px no-repeat,
        linear-gradient(var(--paper), var(--paper)) left 50% / 75% 1px no-repeat,
        linear-gradient(var(--paper), var(--paper)) left 100% / 100% 1px no-repeat;
      pointer-events: none;
    }

    .corner-mark {
      position: absolute;
      z-index: 3;
      right: calc(var(--edge) + 1px);
      top: calc(var(--edge) + 1px);
      width: clamp(21px, 3vw, 40px);
      aspect-ratio: 1;
      border-top: 1px solid var(--paper);
      border-right: 1px solid var(--paper);
      opacity: .72;
      pointer-events: none;
    }


    @media (max-width: 640px) {
      :root { --edge: 14px; }
      .poster::before { inset: var(--edge); }
      .catalogue {
        inset: -16vh -72vw;
        gap: 16px;
        transform: rotate(-9deg) scale(1.2);
        opacity: .7;
      }
      .entry { font-size: 15px; }
      .composition {
        padding: calc(var(--edge) + clamp(10px, 2svh, 18px)) calc(var(--edge) + 20px);
      }
      .headline--first {
        font-size: clamp(34px, min(12.7vw, 12.5svh), 78px);
        max-width: 8.8em;
      }
      .headline--second {
        font-size: clamp(34px, min(12.4vw, 12.5svh), 76px);
        max-width: 8.8em;
      }
      .headline--first .headline__line:last-child { padding-left: .25em; }
      .headline--second .headline__line:first-child { padding-right: .35em; }
      .date { margin-top: clamp(10px, 2.2svh, 20px); font-size: 16px; }
      .registration { display: none; }
    }

    @media (max-width: 360px) {
      .headline--first, .headline--second { font-size: clamp(30px, min(12vw, 12svh), 46px); }
      .composition { padding-right: 28px; padding-left: 28px; }
    }

  <script>
    (() => {
      const source = document.getElementById("works-data").textContent.trim();
      const catalogue = document.querySelector(".catalogue");

      function parseCSV(text) {
        const rows = [];
        let row = [];
        let field = "";
        let quoted = false;

        for (let index = 0; index < text.length; index += 1) {
          const character = text[index];
          if (quoted) {
            if (character === '"' && text[index + 1] === '"') {
              field += '"';
              index += 1;
            } else if (character === '"') {
              quoted = false;
            } else {
              field += character;
            }
          } else if (character === '"' && field.length === 0) {
            quoted = true;
          } else if (character === ",") {
            row.push(field);
            field = "";
          } else if (character === "\n" || character === "\r") {
            if (character === "\r" && text[index + 1] === "\n") index += 1;
            row.push(field);
            if (row.some((value) => value !== "")) rows.push(row);
            row = [];
            field = "";
          } else {
            field += character;
          }
        }

        if (field !== "" || row.length > 0) {
          row.push(field);
          if (row.some((value) => value !== "")) rows.push(row);
        }
        return rows;
      }

      function censorAuthor(author) {
        return Array.from(author, (character) =>
          /[\p{L}\p{N}]/u.test(character) ? "█" : character
        ).join("");
      }

      function addField(entry, className, value) {
        const field = document.createElement("span");
        field.className = className;
        field.textContent = value;
        entry.appendChild(field);
      }

      const [, ...records] = parseCSV(source);
      const works = records
        .filter((record) => record.length === 5)
        .map(([title, author, year, medium, culture]) => ({ title, author, year, medium, culture }));
      const pixelsPerSecond = 20;
      const lanes = [];

      function addWork(run, work) {
        const entry = document.createElement("span");
        entry.className = "entry";
        addField(entry, "entry__title", work.title);
        addField(entry, "entry__dash", "—");
        addField(entry, "entry__mask", censorAuthor(work.author));
        addField(entry, "entry__dash", "—");
        addField(entry, "entry__year", work.year);
        run.appendChild(entry);
      }

      for (let laneIndex = 0; laneIndex < 6; laneIndex += 1) {
        const lane = document.createElement("div");
        lane.className = "lane";
        const offset = (laneIndex * 23) % works.length;
        const orderedWorks = works.slice(offset).concat(works.slice(0, offset));
        let firstRun;

        for (let copy = 0; copy < 2; copy += 1) {
          const run = document.createElement("div");
          run.className = "lane__run";
          orderedWorks.forEach((work) => addWork(run, work));
          if (copy === 0) firstRun = run;
          lane.appendChild(run);
        }
        catalogue.appendChild(lane);
        lanes.push({
          element: lane,
          measureFrom: firstRun,
          width: 0,
          offset: 0,
          speed: pixelsPerSecond,
          direction: laneIndex % 2 === 0 ? -1 : 1,
        });
      }

      function measureLanes() {
        lanes.forEach((lane) => {
          lane.width = lane.measureFrom.offsetWidth;
          if (lane.width > 0) lane.offset %= lane.width;
        });
      }

      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      if (!reducedMotion.matches) {
        let previousTime = 0;
        function moveRows(now) {
          const elapsed = previousTime ? Math.min((now - previousTime) / 1000, 0.05) : 0;
          previousTime = now;
          lanes.forEach((lane) => {
            if (!lane.width) return;
            lane.offset = (lane.offset + lane.speed * elapsed) % lane.width;
            lane.element.style.transform = `translate3d(${lane.direction * lane.offset}px, 0, 0)`;
          });
          requestAnimationFrame(moveRows);
        }

        const startMotion = () => {
          measureLanes();
          requestAnimationFrame(moveRows);
        };
        if (document.fonts?.ready) document.fonts.ready.then(startMotion);
        else startMotion();
        window.addEventListener("resize", measureLanes, { passive: true });
        document.fonts?.addEventListener("loadingdone", measureLanes);
      }
    })();
  </script>
</body>
</html>
