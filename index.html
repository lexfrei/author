<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8f2027">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
  <title>У ВАС АВТОР УМЕР — А ЖИВ ЛИ ЗРИТЕЛЬ</title>
  <style>
    :root {
      color-scheme: dark;
      --red: #8f2027;
      --paper: #f4ead2;
      --ink: #130f0d;
      --line: rgba(244, 234, 210, .28);
      --edge: clamp(18px, 3.2vw, 54px);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--red);
      color: var(--paper);
      font-family: Arial, Helvetica, sans-serif;
    }

    .poster {
      position: relative;
      isolation: isolate;
      height: 100svh;
      overflow: hidden;
      background: var(--red);
    }

    .poster::before {
      content: "";
      position: absolute;
      z-index: 1;
      inset: var(--edge);
      border: 1px solid var(--line);
      pointer-events: none;
    }

    .poster::after {
      content: "";
      position: absolute;
      z-index: 1;
      width: min(41vw, 560px);
      aspect-ratio: 1;
      right: -14vw;
      top: -26vw;
      border: 1px solid rgba(19, 15, 13, .24);
      border-radius: 50%;
      pointer-events: none;
    }

    .catalogue {
      position: absolute;
      z-index: -1;
      inset: -38vh -20vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(13px, 2.1vh, 28px);
      transform: rotate(-16deg) scale(1.12);
      opacity: .8;
      pointer-events: none;
    }

    .lane {
      display: flex;
      width: max-content;
      white-space: nowrap;
      will-change: transform;
    }

    .entry {
      display: inline-flex;
      align-items: baseline;
      gap: .46em;
      padding-right: clamp(27px, 4.4vw, 76px);
      color: rgba(244, 234, 210, .77);
      font-size: clamp(14px, 1.55vw, 25px);
      font-weight: 700;
      letter-spacing: .025em;
      line-height: 1;
    }

    .entry__title, .entry__year { color: var(--paper); }
    .entry__dash { color: rgba(244, 234, 210, .5); }
    .entry__mask { color: var(--ink); letter-spacing: .015em; }

    .composition {
      position: relative;
      z-index: 2;
      display: flex;
      height: 100%;
      flex-direction: column;
      justify-content: space-between;
      /* less than --edge: the headlines deliberately cross the frame line */
      padding: max(10px, var(--edge) * .5);
    }

    .headline {
      margin: 0;
      font-weight: 900;
      line-height: .83;
      letter-spacing: -.075em;
      text-transform: uppercase;
    }

    .headline--first {
      align-self: flex-start;
      font-family: Helvetica, Arial, sans-serif;
      font-size: clamp(43px, min(11.25vw, 16svh), 190px);
    }

    /* Inter is wider than Helvetica: the Helvetica tracking makes its letters collide */
    .headline--second {
      align-self: flex-end;
      text-align: right;
      font-family: Inter, Helvetica, Arial, sans-serif;
      font-size: clamp(43px, min(11.7vw, 16svh), 198px);
      letter-spacing: -.04em;
    }

    .headline__line { display: block; }
    .headline--first .headline__line:last-child { padding-left: .58em; }
    .headline--second .headline__line:first-child { padding-right: .7em; }

    .date {
      display: block;
      margin-top: clamp(12px, 2.5svh, 26px);
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(15px, 2vw, 28px);
      font-weight: 700;
      letter-spacing: .04em;
      line-height: 1;
      text-transform: none;
    }

    .date::before {
      content: "";
      display: inline-block;
      width: clamp(32px, 5vw, 74px);
      height: 2px;
      margin: 0 .65em .28em 0;
      background: currentColor;
      opacity: .75;
    }

    .registration {
      position: absolute;
      z-index: 3;
      top: 50%;
      left: calc(var(--edge) + 1px);
      width: clamp(13px, 1.2vw, 18px);
      height: 76px;
      transform: translateY(-50%);
      opacity: .6;
      background: linear-gradient(var(--paper), var(--paper)) center / 1px 100% no-repeat,
        linear-gradient(var(--paper), var(--paper)) left 0 / 100% 1px no-repeat,
        linear-gradient(var(--paper), var(--paper)) left 50% / 75% 1px no-repeat,
        linear-gradient(var(--paper), var(--paper)) left 100% / 100% 1px no-repeat;
    }

    .corner-mark {
      position: absolute;
      z-index: 3;
      right: calc(var(--edge) + 1px);
      top: calc(var(--edge) + 1px);
      width: clamp(21px, 3vw, 40px);
      aspect-ratio: 1;
      border-top: 1px solid var(--paper);
      border-right: 1px solid var(--paper);
      opacity: .72;
    }

    @media (max-width: 640px) {
      :root { --edge: 14px; }
      .catalogue {
        inset: -16vh -72vw;
        gap: 16px;
        transform: rotate(-14deg) scale(1.2);
        opacity: .7;
      }
      .entry { font-size: 15px; }
      .headline--first { font-size: clamp(34px, min(12.7vw, 12.5svh), 78px); }
      .headline--second { font-size: clamp(34px, min(12.4vw, 12.5svh), 76px); }
      .headline--first .headline__line:last-child { padding-left: .25em; }
      .headline--second .headline__line:first-child { padding-right: .35em; }
      .date { margin-top: clamp(10px, 2.2svh, 20px); font-size: 16px; }
      .registration { display: none; }
    }

    @media (max-width: 360px) {
      .headline--first, .headline--second { font-size: clamp(30px, min(12vw, 12svh), 46px); }
    }
  </style>
</head>
<body>
  <main class="poster">
    <div class="catalogue" aria-hidden="true"></div>
    <div class="registration" aria-hidden="true"></div>
    <div class="corner-mark" aria-hidden="true"></div>

    <section class="composition">
      <h1 class="headline headline--first">
        <span class="headline__line">У ВАС</span>
        <span class="headline__line">АВТОР УМЕР</span>
        <span class="date">1967</span>
      </h1>
      <p class="headline headline--second">
        <span class="headline__line">А ЖИВ ЛИ</span>
        <span class="headline__line">ЗРИТЕЛЬ</span>
        <span class="date">сегодня</span>
      </p>
    </section>
  </main>
  <script type="module">
    const LANES = 6;
    const SPEED = 20; // px per second

    const catalogue = document.querySelector(".catalogue");
    const response = await fetch("works.csv");
    if (!response.ok) throw new Error(`works.csv: HTTP ${response.status}`);

    // Fields never contain line breaks, so a row is a line.
    const [, ...rows] = (await response.text()).trim().split(/\r?\n/);
    const works = rows.map((row) => Array.from(
      row.matchAll(/(?:^|,)(?:"((?:[^"]|"")*)"|([^,]*))/g),
      ([, quoted, plain]) => quoted?.replaceAll('""', '"') ?? plain,
    ));

    function span(className, text) {
      const element = document.createElement("span");
      element.className = className;
      element.textContent = text;
      return element;
    }

    function randomEntry() {
      const [title, author, year] = works[Math.floor(Math.random() * works.length)];
      const entry = span("entry", "");
      entry.append(
        span("entry__title", title),
        span("entry__dash", "—"),
        // \p{M}: combining marks would otherwise stack on top of the blocks
        span("entry__mask", author.replace(/[\p{L}\p{M}\p{N}]/gu, "█")),
        span("entry__dash", "—"),
        span("entry__year", year),
      );
      return entry;
    }

    // offsetWidth is rounded to whole pixels; summing it would make lanes twitch.
    const widthOf = (element) => parseFloat(getComputedStyle(element).width);

    const lanes = Array.from({ length: LANES }, (_, index) => {
      const element = document.createElement("div");
      element.className = "lane";
      catalogue.append(element);
      return { element, x: 0, direction: index % 2 ? 1 : -1 };
    });

    // Keeps the lane covering [0, catalogue width]: entries are added on the
    // side that comes into view and dropped once they have fully left it.
    function fill(lane) {
      const { element } = lane;
      const limit = catalogue.clientWidth;
      if (!limit) return;
      while (lane.x > 0) {
        const entry = randomEntry();
        element.prepend(entry);
        lane.x -= widthOf(entry);
      }
      while (element.firstChild && lane.x + widthOf(element.firstChild) <= 0) {
        lane.x += widthOf(element.firstChild);
        element.firstChild.remove();
      }
      while (lane.x + widthOf(element) < limit) element.append(randomEntry());
      while (element.lastChild && lane.x + widthOf(element) - widthOf(element.lastChild) >= limit) {
        element.lastChild.remove();
      }
      element.style.transform = `translateX(${lane.x}px)`;
    }

    if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
      const fillAll = () => lanes.forEach(fill);
      fillAll();
      addEventListener("resize", fillAll, { passive: true });
    } else {
      let previous;
      requestAnimationFrame(function frame(now) {
        // Clamped so a backgrounded tab does not jump on return.
        const elapsed = previous === undefined ? 0 : Math.min(now - previous, 50) / 1000;
        previous = now;
        for (const lane of lanes) {
          lane.x += lane.direction * SPEED * elapsed;
          fill(lane);
        }
        requestAnimationFrame(frame);
      });
    }
  </script>
</body>
</html>
